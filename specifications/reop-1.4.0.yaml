        properties:
          name:
            $ref: "#/components/schemas/AmenityKey"
      then: {}
      else:
        required:
          - label
    InterestItem:
      type: object
      description: Point of interest near the project. `type` SHOULD be a key of vocabularies/interests.json (the 1.3.0 InterestEnum); other values are allowed.
      required:
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/LocalizedString"
        type:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        distanceMeters:
          type: integer
          minimum: 0
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        showOnMap:
          type: boolean
          default: true
          description: Whether a map consumer should pin this point.
        description:
          $ref: "#/components/schemas/LocalizedString"
    Orientation:
      type: string
      enum:
        - north
        - south
        - east
        - west
        - northEast
        - northWest
        - southEast
        - southWest
    View:
      type: string
      enum:
        - sea_full
        - sea_partial
        - city
        - park
        - garden
        - pool
        - mountain
        - lake
        - river
        - marina
        - forest
        - street
        - courtyard
        - golf_course
        - landmark
        - internal
    UnitFeatures:
      type: object
      description: Physical features of a unit or unit type (the 1.3.0 inventory `features`, now also allowed on unit models).
      properties:
        orientation:
          type: array
          items:
            $ref: "#/components/schemas/Orientation"
          uniqueItems: true
        view:
          $ref: "#/components/schemas/View"
        tags:
          type: array
          items:
            type: string
          description: Free tags (highCeilings, premiumFinish, privateElevator).
    UnitSpecs:
      type: object
      description: "Room counts and areas. `rooms` and `bedrooms` are independent facts: store what the source states, never derive one from the other."
      properties:
        rooms:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.5
          description: "Habitable-room count as a listing in the market of `location.countryCode` would print it (Israel, Germany, France: living room included; half rooms allowed). See vocabularies/roomCountConventions.json."
        bedrooms:
          type: number
          minimum: 0
          description: Number of separate sleeping rooms. 0 = studio, when the source makes clear there is no separate bedroom.
        bathrooms:
          type: number
          minimum: 0
        interiorAreaSqm:
          type: number
          minimum: 0
        balconyAreaSqm:
          type: number
          minimum: 0
        gardenAreaSqm:
          type: number
          minimum: 0
        storageAreaSqm:
          type: number
          minimum: 0
        totalAreaSqm:
          type: number
          minimum: 0
          description: Informative total (interior plus balconies and other counted areas as the market defines).
        parkingSpaces:
          type: integer
          minimum: 0
    Availability:
      type: string
      enum:
        - available
        - last_units
        - sold_out
      description: "Availability summary of a unit type. Absent = available. When inventory units exist for the type, consumers derive it: A = number of units with status `available`; sold_out when A = 0, last_units when A is small (operator threshold), available otherwise. Only `available` units count; onHold, reserved, booked, sold and notForSale never do."
    UnitModel:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/LocalizedString"
        description:
          $ref: "#/components/schemas/LocalizedString"
        specs:
          $ref: "#/components/schemas/UnitSpecs"
        features:
          $ref: "#/components/schemas/UnitFeatures"
        availability:
          $ref: "#/components/schemas/Availability"
        marketing:
          $ref: "#/components/schemas/UnitModelMarketing"
        extensions:
          $ref: "#/components/schemas/Extensions"
    GreenCertification:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        level:
          type: string
    Floor:
      type: object
      required:
        - number
      properties:
        id:
          $ref: "#/components/schemas/Id"
        number:
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedString"
        marketing:
          $ref: "#/components/schemas/FloorMarketing"
        extensions:
          $ref: "#/components/schemas/Extensions"
    Building:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/LocalizedString"
        description:
          $ref: "#/components/schemas/LocalizedString"
        numberOfFloors:
          type: integer
          minimum: 0
          description: Total floors.
        floorsAboveGround:
          type: integer
          minimum: 0
        floorsBelowGround:
          type: integer
          minimum: 0
        numberOfElevators:
          type: integer
          minimum: 0
        yearConstructed:
          type: integer
          minimum: 1800
          maximum: 2200
        architect:
          $ref: "#/components/schemas/LocalizedString"
        architectureStyle:
          $ref: "#/components/schemas/LocalizedString"
        constructionMaterials:
          type: array
          items:
            type: string
        greenCertifications:
          type: array
          items:
            $ref: "#/components/schemas/GreenCertification"
        marketing:
          $ref: "#/components/schemas/BuildingMarketing"
        floors:
          type: array
          items:
            $ref: "#/components/schemas/Floor"
        extensions:
          $ref: "#/components/schemas/Extensions"
    UnitStatus:
      type: string
      enum:
        - available
        - onHold
        - reserved
        - booked
        - sold
        - notForSale
      description: "available = for sale now; onHold = temporarily withheld by the developer; reserved = held by a buyer, not yet contracted; booked = contract signed, not yet sold / registered; sold; notForSale = not offered. Transitions: available <-> onHold <-> reserved -> booked -> sold; any -> notForSale. Only `available` is buyer-available."
    Reservation:
      type: object
      description: Opaque reservation facts for `reserved` / `booked` units. Never carries buyer identity.
      properties:
        until:
          type: string
          format: date-time
          description: When the hold expires.
        reference:
          type: string
          description: Opaque external reference (CRM / ERP key).
    UnitLinks:
      type: object
      required:
        - modelId
      properties:
        modelId:
          $ref: "#/components/schemas/Id"
          description: References unitModels[].id.
        buildingId:
          $ref: "#/components/schemas/Id"
          description: References buildings[].id.
        floorId:
          $ref: "#/components/schemas/Id"
          description: References buildings[].floors[].id.
    Unit:
      type: object
      description: A specific inventory unit (apartment). Structure from 1.3.0; 1.4.0 adds timestamps, overrides, media, reservation facts and external ids for ERP / CRM synchronisation.
      required:
        - id
        - unitNumber
        - status
        - links
      properties:
        id:
          $ref: "#/components/schemas/Id"
        unitNumber:
          type: string
        links:
          $ref: "#/components/schemas/UnitLinks"
        floorNumber:
          type: integer
          description: Convenience when floors[] is not modelled.
        status:
          $ref: "#/components/schemas/UnitStatus"
        statusUpdatedAt:
          type: string
          format: date-time
        price:
          $ref: "#/components/schemas/Money"
          description: Current asking price.
        priceUpdatedAt:
          type: string
          format: date-time
        startingPrice:
          $ref: "#/components/schemas/Money"
          description: List price before incentives (informative).
        specs:
          $ref: "#/components/schemas/UnitSpecs"
          description: Overrides of the unit model's specs for this unit.
        features:
          $ref: "#/components/schemas/UnitFeatures"
        marketing:
          $ref: "#/components/schemas/UnitMarketing"
        reservation:
          $ref: "#/components/schemas/Reservation"
        externalIds:
          type: object
          additionalProperties:
            type: string
          description: Ids of this unit in external systems, keyed by system name.
        extensions:
          $ref: "#/components/schemas/Extensions"
    Developer:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/LocalizedString"
        description:
          $ref: "#/components/schemas/LocalizedString"
        projectIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          description: Projects this developer is involved in (catalog documents).
        companyDetails:
          type: object
          properties:
            legalName:
              $ref: "#/components/schemas/LocalizedString"
            companyId:
              type: string
            vatId:
              type: string
        history:
          type: object
          properties:
            yearsExperience:
              type: integer
              minimum: 0
            projectsDelivered:
              type: integer
              minimum: 0
            unitsSold:
              type: integer
              minimum: 0
        contact:
          $ref: "#/components/schemas/ContactInfo"
        location:
          $ref: "#/components/schemas/Location"
        marketing:
          $ref: "#/components/schemas/DeveloperMarketing"
        extensions:
          $ref: "#/components/schemas/Extensions"
    Project:
      type: object
      required:
        - id
        - name
        - status
        - location
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/LocalizedString"
        developerIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          minItems: 1
          description: Developers involved. Required in a catalog; optional in a ProjectDocument that carries `developer`.
        description:
          $ref: "#/components/schemas/LocalizedString"
        type:
          $ref: "#/components/schemas/ProjectType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        marketing:
          $ref: "#/components/schemas/ProjectMarketing"
        paymentPlan:
          $ref: "#/components/schemas/PaymentPlan"
        legal:
          $ref: "#/components/schemas/LegalInfo"
        interests:
          type: array
          items:
            $ref: "#/components/schemas/InterestItem"
        amenities:
          type: array
          items:
            $ref: "#/components/schemas/AmenityItem"
        unitModels:
          type: array
          items:
            $ref: "#/components/schemas/UnitModel"
        buildings:
          type: array
          items:
            $ref: "#/components/schemas/Building"
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
          description: Specific units. `links.modelId` MUST reference a unitModels[].id; buildingId / floorId MUST reference existing ids when given. Unit ids MUST be unique within the project.
        extensions:
          $ref: "#/components/schemas/Extensions"
    RealEstateCatalog:
      type: object
      description: "Feed document: flattened lists of developers and projects linked by ids."
      required:
        - protocol
        - developers
        - projects
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        developers:
          type: array
          items:
            $ref: "#/components/schemas/Developer"
        projects:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Project"
              - required:
                  - developerIds
        extensions:
          $ref: "#/components/schemas/Extensions"
      not:
        required:
          - project
    ProjectDocument:
      type: object
      description: "Single-project document: one project with its primary developer (and optionally all developers). This is the shape an API exchanges for one project."
      required:
        - protocol
        - project
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        project:
          $ref: "#/components/schemas/Project"
        developer:
          $ref: "#/components/schemas/Developer"
          description: The primary developer. Implied as `project.developerIds[0]` when that list is absent.
        developers:
          type: array
          items:
            $ref: "#/components/schemas/Developer"
          description: All developers, when more than one.
        extensions:
          $ref: "#/components/schemas/Extensions"
      not:
        required:
          - projects
    InventoryUnitUpdate:
      type: object
      description: "Partial update of one unit: only the given members change. Unknown ids are created when `links.modelId` and `unitNumber` are supplied."
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/Id"
        unitNumber:
          type: string
        links:
          $ref: "#/components/schemas/UnitLinks"
        floorNumber:
          type: integer
        status:
          $ref: "#/components/schemas/UnitStatus"
        statusUpdatedAt:
          type: string
          format: date-time
        price:
          $ref: "#/components/schemas/Money"
        priceUpdatedAt:
          type: string
          format: date-time
        reservation:
          $ref: "#/components/schemas/Reservation"
        externalIds:
          type: object
          additionalProperties:
            type: string
    InventoryUpdate:
      type: object
      description: Delta document for availability synchronisation (ERP / CRM to marketplace). Idempotent per (id, statusUpdatedAt).
      required:
        - protocol
        - projectId
        - updates
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        projectId:
          $ref: "#/components/schemas/Id"
        generatedAt:
          type: string
          format: date-time
        updates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InventoryUnitUpdate"
        extensions:
          $ref: "#/components/schemas/Extensions"
